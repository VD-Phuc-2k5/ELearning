allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  less: true
  nx: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - yaml@2.9.0
  - next@16.2.6
  - postcss@8.5.10
  - brace-expansion@5.0.6
  - ws@8.21.0
  - uuid@11.1.1
  - tmp@0.2.6
overrides:
  brace-expansion@>=5.0.0 <5.0.6: ^5.0.6
  next@<16.2.6: ^16.2.6
  postcss@<8.5.10: ^8.5.10
  tmp@<0.2.6: ^0.2.6
  uuid@<11.1.1: ^11.1.1
  ws@>=8.0.0 <8.20.1: ^8.20.1
  yaml@>=2.0.0 <2.8.3: ^2.8.3
